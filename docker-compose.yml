services:

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    environment:
      PUID: 1000
      PGID: 1000
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./data/npm:/data
      - ./data/npm-letsencrypt:/etc/letsencrypt
    networks:
      - default
      - internal
    restart: unless-stopped

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/timescale:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    # No host port binding -- internal Docker network only

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - ./data/mongo:/data/db
    networks:
      - internal
    restart: unless-stopped
    # No host port binding -- internal Docker network only

  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    networks:
      - internal
    depends_on:
      - timescaledb
      - mongodb
    restart: unless-stopped

  nextjs:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://api.farm.local
      NEXT_PUBLIC_WS_URL: ws://api.farm.local
    networks:
      - internal
    depends_on:
      - fastapi
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL: http://grafana.farm.local
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - internal
    ports:
      - "3001:3000"
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  grafana_data:
